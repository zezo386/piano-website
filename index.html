<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div>
        <h1>A Piano</h1>
        <h3>lets play some music here</h3>
        <p><a href="tutorial.html">click here</a> to see the readme and know how to play the paino</p>
    </div>
    <div class="control-panel">
        <h2>Control Panel: </h2>
        <p>Current Octave: <span id="Octave" class="octave">4</span></p>
        <p>Select Wave Form 
            <select id="waveFormSelect">
                <option value="triangle">Triangle (classic)</option>
                <option value="sine">Sine</option>
                <option value="square">Square</option>
                <option value="sawtooth">SawTooth</option>
            </select>
        </p>
    </div>
    <div class="piano" id="piano">
        <span class="key white" id="C">C</span>
        <span class="key black" id="C#">C#</span>

        <span class="key white" id="D">D</span>
        <span class="key black" id="D#">D#</span>

        <span class="key white" id="E">E</span>

        <span class="key white" id="F">F</span>
        <span class="key black" id="F#">F#</span>

        <span class="key white" id="G">G</span>
        <span class="key black" id="G#">G#</span>

        <span class="key white" id="A">A</span>
        <span class="key black" id="A#">A#</span>

        <span class="key white" id="B">B</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.52/Tone.js"></script>
    <script src="main.js"></script>
</body>
</html>
